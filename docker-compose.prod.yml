# BioArchitect — продакшн (запускается на VPS Hetzner DE / Zomro NL)
# Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Изменения:
#   - target: production вместо dev
#   - restart: always
#   - Traefik как reverse proxy с авто-Let's Encrypt
#   - убираем порты postgres/redis наружу
#   - монтирование томов только для read

services:
  postgres:
    ports: []          # БД не наружу
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql применяется только при первом запуске, в проде не монтируем
    restart: always

  redis:
    ports: []
    restart: always

  bot:
    build:
      target: production
    restart: always
    volumes: []        # код вшит в образ
    command: ["python", "-m", "src.bot.main"]

  api:
    build:
      target: production
    restart: always
    volumes: []
    ports: []          # доступ только через traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    build:
      target: production
    restart: always
    volumes: []

  traefik:
    image: traefik:v3.2
    container_name: bioarchitect-traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - bioarchitect-net

volumes:
  traefik_letsencrypt:
    name: bioarchitect_traefik_letsencrypt
