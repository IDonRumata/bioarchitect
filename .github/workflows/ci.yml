name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Mypy strict
        run: uv run mypy src

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bioarchitect
          POSTGRES_PASSWORD: bioarchitect
          POSTGRES_DB: bioarchitect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://bioarchitect:bioarchitect@localhost:5432/bioarchitect_test
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: dummy
          ANTHROPIC_API_KEY: dummy
        run: uv run pytest -m unit --cov=src --cov-report=xml
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://bioarchitect:bioarchitect@localhost:5432/bioarchitect_test
          REDIS_URL: redis://localhost:6379/0
          TELEGRAM_BOT_TOKEN: dummy
          ANTHROPIC_API_KEY: dummy
        run: uv run pytest -m integration --cov=src --cov-append --cov-report=xml

  censor-eval:
    name: Censor Agent eval suite (CI gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Run Censor eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
          TELEGRAM_BOT_TOKEN: dummy
        run: uv run pytest -m censor_eval --tb=short

  security:
    name: Security scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
